---
- name: Clone may ao moi tu Template tren vCenter
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs | default(false) }}"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    folder: "{{ vcenter_folder | default('/VMs') }}"
    name: "{{ vm_name }}"
    state: poweredon
    template: "{{ vm_template_name }}"
    disk:
      - size_gb: "{{ vm_disk_size_gb | default(50) }}"
        type: thin
        datastore: "{{ vcenter_datastore }}"
    hardware:
      memory_mb: "{{ vm_ram_mb | default(4096) }}"
      num_cpus: "{{ vm_vcpu | default(2) }}"
    networks:
      - name: "{{ vm_network_name }}"
        ip: "{{ vm_ip_address }}"
        netmask: "{{ vm_netmask | default('255.255.255.0') }}"
        gateway: "{{ vm_gateway }}"
...
