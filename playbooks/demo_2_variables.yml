---
- name: Demo Chuong 3 - Variables, Facts & Ansible Vault
  hosts: dev
  gather_facts: true
  vars:
    app_name: "Ansible Demo Portal"
    app_version: "2.4.0"
    developer_name: "Duc Nam"

  tasks:
    - name: 1. Hien thi cac bien duoc dinh nghia trong Playbook
      ansible.builtin.debug:
        msg: "Ung dung: {{ app_name }} (Phien ban: {{ app_version }}) - Phat trien boi: {{ developer_name }}"

    - name: 2. Thu thap va in ra cac thong tin thoi gian thuc (Facts) cua may con
      ansible.builtin.debug:
        msg: 
          - "--- THONG TIN MAY CON (172.25.250.20) ---"
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "FQDN: {{ ansible_facts['fqdn'] }}"
          - "He dieu hanh: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "OS Family: {{ ansible_facts['os_family'] }}"
          - "Dia chi IP cua: {{ ansible_facts['default_ipv4']['interface'] }} la {{ ansible_facts['default_ipv4']['address'] }}"
          - "Dung luong RAM con trong: {{ ansible_facts['memfree_mb'] }} MB / {{ ansible_facts['memtotal_mb'] }} MB"

    - name: 3. Demo goi bien trong chuoi ky tu (Jinja2 syntax)
      ansible.builtin.debug:
        msg: "Thu muc home cua user hien tai la: {{ ansible_facts['user_dir'] }}"

    # --------------------------------------------------------------------------
    # DEMO LOCAL FACTS (CUSTOM FACTS CỦA CHƯƠNG 3)
    # --------------------------------------------------------------------------
    - name: "4. Dam bao thu muc /etc/ansible/facts.d ton tai (Yeu cau become: true)"
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        mode: '0755'
      become: true

    - name: "5. Tao file custom.fact tren may con (Yeu cau become: true)"
      ansible.builtin.copy:
        content: |
          [webserver]
          package = httpd
          service = httpd
        dest: /etc/ansible/facts.d/custom.fact
        mode: '0644'
      become: true

    - name: 6. Reload facts de Ansible cap nhat bien local ngay lap tuc
      ansible.builtin.setup:
        filter: ansible_local

    - name: 7. In ra gia tri Local Fact tu file custom.fact de kiem chung
      ansible.builtin.debug:
        msg:
          - "--- KIEM CHUNG LOCAL FACTS ---"
          - "Gia tri package: {{ ansible_facts['ansible_local']['custom']['webserver']['package'] }}"
          - "Gia tri service: {{ ansible_facts['ansible_local']['custom']['webserver']['service'] }}"

