[defaults]
# Use the YAML inventory defined in the demo folder
inventory = ./inventory.yml

# Load custom collections from the local folder, falling back to container default paths
collections_path = ./collections:/usr/share/ansible/collections

# Disable SSH Host Key Verification for lab/demo ease
host_key_checking = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
