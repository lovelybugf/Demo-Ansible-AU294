[defaults]
# 1. CẤU HÌNH INVENTORY MẶC ĐỊNH
# Đường dẫn trỏ tới tệp danh sách máy chủ đích (sử dụng định dạng YAML thay vì INI để tối ưu hóa)
inventory = ./inventory.yml

# 2. ĐƯỜNG DẪN TẢI/SỬ DỤNG COLLECTIONS
# Định nghĩa thư mục lưu trữ Ansible Collections tải về từ requirements.yml. 
# Thư mục hiện tại (./collections) được xếp trước để nạp collections cục bộ, sau đó fallback về thư mục mặc định của hệ thống/container
collections_path = ./collections:/usr/share/ansible/collections

# 3. TẮT XÁC THỰC KHÓA SSH (Host Key Verification)
# Tắt chế độ hỏi Yes/No khi kết nối tới các máy đích mới lần đầu tiên qua SSH (Rất hữu ích trong môi trường Lab)
host_key_checking = False

[privilege_escalation]
# 4. CẤU HÌNH LEO THANG ĐẶC QUYỀN (SUDO)
# Tự động leo thang quyền quản trị tối cao (root) trên máy đích khi thực thi tasks
become = True

# Sử dụng phương pháp sudo tiêu chuẩn của hệ điều hành Linux
become_method = sudo

# Tài khoản đích sau khi nâng quyền là tài khoản root
become_user = root

# Không hỏi mật khẩu sudo khi chạy (máy đích cần được cấu hình passwordless sudo cho user kết nối)
become_ask_pass = False
