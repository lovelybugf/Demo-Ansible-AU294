[defaults]
# Path to the inventory file
inventory = ./inventory

# Disable SSH host key checking (useful for lab environments)
host_key_checking = False

# Default remote user (will be overridden by host vars or container settings)
remote_user = root

[privilege_escalation]
# Automatically escalate privileges
become = True
become_method = sudo
become_user = root
become_ask_pass = False
