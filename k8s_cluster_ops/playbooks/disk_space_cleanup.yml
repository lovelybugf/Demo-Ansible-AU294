---
- name: Giam sat va don dep o dia /data tren cac Node
  hosts: all
  become: true
  tasks:
    - name: Kiem tra dung luong dia phan vung /data truoc khi don dep
      ansible.builtin.command: df -h /data
      register: disk_before

    - name: Hien thi dung luong truoc don dep
      ansible.builtin.debug:
        var: disk_before.stdout_lines

    - name: Don dep cac file log tam thoi trong thu muc /var/tmp va /tmp
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/*.log"
        - "/tmp/*.log"

    - name: Kiem tra dung luong dia phan vung /data sau khi don dep
      ansible.builtin.command: df -h /data
      register: disk_after

    - name: Hien thi dung luong sau don dep
      ansible.builtin.debug:
        var: disk_after.stdout_lines
...
